<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Page not found</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/arcade/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/arcade/apple-touch-icon.png">
<meta name="theme-color" content="#0d1f2a">
<link rel="stylesheet" href="/arcade/arcade.css?v=2">
<style>
  /* Shown by GitHub Pages for any missing address under /arcade/, so every path here is absolute. */
  .cab { padding-top: 10vh; gap: 18px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a { display: inline-block; text-decoration: none; padding: 10px 18px; border-radius: 4px; font-weight: 600; }
  .links a:first-child { background: var(--snake); color: var(--ground); }
  .links a:last-child { color: var(--ink); box-shadow: inset 0 0 0 1px var(--grid); }
</style>

<div class="cab">
  <h1 style="color: var(--snake)">Page not found</h1>
  <p class="rule">There’s no game or page at this address. It may have been renamed or moved.</p>
  <p class="links"><a href="/arcade/" id="home">Go to the Arcade</a><a href="/">Go to the main page</a></p>
</div>
<script>document.getElementById('home').focus();</script>
